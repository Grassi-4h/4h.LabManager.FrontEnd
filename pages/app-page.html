<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../js/app-page-script.js"></script> 
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="icon" type="image/png" href="../resources/logos/tab-logo.png"/>
    <title>LabM - App</title>
</head>
<body class="flex flex-col relative" id="background">

    <div class="col-span-5 backdrop-blur-xs border border-white/40 p-0.5 rounded-2xl shadow-[0_8px_20px_0_rgba(0,0,0,0.65)] bg-white/10 m-2">
        <div class="w-full h-full flex items-center justify-between p-2">
            <div class="flex items-center gap-3">
                <img id="logo-app-header" src="../resources/logos/icon-logo.png" width="50" height="50"/>
            </div>
            <img width="50" height="50" class="h-12 w-12 rounded-2xl shadow-[0_8px_20px_0_rgba(0,0,0,0.65)] hover:cursor-pointer delay-50 duration-300 ease-in-out hover:bg-white" src="../resources/persons/Alessio Scaringella.jpg"></img>
        </div>
    </div>
    
    <div class="flex flex-row flex-grow">
        <div class="flex-1 m-2 pr-5 pl-5 pb-7 pt-7 overflow-auto rounded-2xl bg-white/10 backdrop-blur-xs border border-white/40 shadow-[0_8px_20px_0_rgba(0,0,0,0.65)] items-center text-center">
            <b id="opzioniBTN" class="text-l text-black px-4 p-1 hover:underline">Opzioni</b>
            <button id="btnOpzione1" class="mt-23 text-l text-black px-4 p-1 rounded-2xl shadow-[0_8px_20px_0_rgba(0,0,0,0.65)] backdrop-blur-3xl bg-white/1000 hover:cursor-pointer transition delay-50 duration-300 ease-in-out hover:bg-white hover:text-black hover:scale-110">
                computer
            </button>
        </div>
        
        <div id="contenutoCentrale" class="flex-10 m-2 pr-5 pl-5 pb-7 pt-7 overflow-auto rounded-2xl bg-white/10 backdrop-blur-xs border border-white/40 shadow-[0_8px_20px_0_rgba(0,0,0,0.65)] items-center text-center text-2xl">
            <b>Sistema gestionale</b>
        </div>
    </div>
    
</body>
</html>
